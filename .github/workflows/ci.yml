name: Firefox TTS static and synthetic tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-dependency-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax validation
        run: |
          find src tests -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Synthetic platform tests (no npm)
        run: node --test
      - name: Native Python source syntax
        run: python3 -m compileall -q native tests tools
      - name: Native installer shell syntax
        run: bash -n native/linux-piper/install-native-host.sh native/linux-piper/uninstall-native-host.sh
      - name: Native framing and disposable-home isolation tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  firefox-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run disposable Firefox + Geckodriver extension smoke
        run: python3 tests/firefox_headless_smoke.py
