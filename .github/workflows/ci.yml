name: Firefox TTS static and synthetic tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-dependency-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax validation
        run: |
          find src tests -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Synthetic platform tests (no npm)
        run: node --test
      - name: Native Python source syntax
        run: python3 -m compileall -q native tests tools
      - name: Native installer shell syntax
        run: bash -n native/linux-piper/install-native-host.sh native/linux-piper/uninstall-native-host.sh native/linux-piper/self-test-cpu.sh
      - name: Native framing and disposable-home isolation tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Exercise optional high-speed batching script in disposable checkout
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git clone --quiet --no-hardlinks --branch main . "$tmp/checkout"
          cd "$tmp/checkout"
          python3 scripts/firefox_tts_high_speed_fix.py
          node --check src/content/linux-piper-engine.js
          node --check src/background/native.js
          python3 -m py_compile native/linux-piper/linux_piper_host.py

  firefox-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run disposable Firefox + Geckodriver extension smoke
        run: python3 tests/firefox_headless_smoke.py

  firefox-reader-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exercise real Firefox reader against QA-only localhost synthetic fixture
        run: python3 tests/firefox_reader_integration.py
      - name: Verify normal Firefox autoplay policy still starts and advances Piper audio
        run: FIREFOX_TTS_QA_AUTOPLAY=1 python3 tests/firefox_reader_integration.py
      - name: Measure 2x Gecko Piper sentence handoff with no intentional pause
        run: FIREFOX_TTS_QA_FAST=1 python3 tests/firefox_reader_integration.py
